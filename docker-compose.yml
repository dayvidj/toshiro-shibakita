version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: toshiro-mysql
    restart: always
    environment:
      MYSQL_DATABASE: toshiro_db
      MYSQL_USER: toshiro
      MYSQL_PASSWORD: toshiro123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build:
      context: ./spring-api
    container_name: toshiro-api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/toshiro_db
      SPRING_DATASOURCE_USERNAME: toshiro
      SPRING_DATASOURCE_PASSWORD: toshiro123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  mysql_data:
